<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototipo de Rastreo Asistido - OpenCV.js</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app__header">
        <h1>Rastreo Asistido de Jugador</h1>
        <p>Template matching experimental con OpenCV.js (sin frameworks).</p>
      </header>

      <section class="panel panel--controls">
        <div class="control-group">
          <label for="videoInput">Cargar vídeo local</label>
          <input id="videoInput" type="file" accept="video/*" />
        </div>
        <div class="control-group control-group--inline">
          <button id="playPauseBtn" disabled>▶ Reproducir</button>
          <button id="startTrackingBtn" disabled>Iniciar seguimiento</button>
          <button id="stopTrackingBtn" disabled>Detener seguimiento</button>
          <button id="resetTrackingBtn" disabled>Reiniciar seguimiento</button>
        </div>
      </section>

      <section class="panel panel--video">
        <div class="video-wrapper">
          <video id="video" controls preload="metadata"></video>
          <canvas id="overlayCanvas"></canvas>
          <canvas id="processingCanvas" class="hidden-canvas"></canvas>
        </div>
        <p id="statusBadge" class="status-badge">Estado: listo</p>
        <p id="scoreText" class="score-text">Score actual: -</p>
        <div id="logPanel" class="log-panel"></div>
      </section>

      <section class="dashboard-grid">
        <article class="panel">
          <h2>Métricas</h2>
          <ul id="metricsList" class="metrics-list"></ul>
        </article>
        <article class="panel">
          <h2>Eventos de tracking</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>#</th><th>Tiempo</th><th>X</th><th>Y</th><th>W</th><th>H</th><th>Score</th></tr></thead>
              <tbody id="eventsBody"></tbody>
            </table>
          </div>
        </article>
      </section>
    </div>

    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
    <script src="app.js"></script>
  </body>
</html>
